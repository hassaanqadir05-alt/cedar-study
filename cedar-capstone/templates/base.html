<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CedarStudy — Student Task & Revision Planner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>CedarStudy</h1>
            {% if session.get('user_id') %}
                <div>
                    <span style="margin-right: 12px;">Hi, <strong>{{ session.get('username') }}</strong></span>
                    <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
                </div>
            {% endif %}
        </header>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="alert">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
