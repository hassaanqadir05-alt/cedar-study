{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 450px; margin: 40px auto;">
    <h2 style="margin-bottom: 16px;">Student Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Log In</button>
    </form>
    <p style="margin-top: 16px; text-align: center; color: #94a3b8;">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: #38bdf8;">Sign Up</a>
    </p>
</div>
{% endblock %}
